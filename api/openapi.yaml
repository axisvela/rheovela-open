openapi: 3.0.3
info:
  title: Rheovela Ops + Worker HTTP API
  description: >
    Single-node HTTP API exposed by `rheo serve` (`internal/server`). All
    routes under `/api/v1` return `application/json`. This is a local
    ops/integration surface — no TLS/auth shim. Multi-tenant auth lives in
    `rheovela-ee` (X-Tenant-ID middleware). The `/mcp` route is a JSON-RPC
    2.0 MCP gateway (protocol version 2024-11-05).
  version: v1.42.0
  license:
    name: Apache-2.0

servers:
  - url: http://127.0.0.1:8080

tags:
  - name: Instances
    description: Process instance lifecycle (open, list, get, steps, compensate).
  - name: Audit
    description: Evidence chain with optional signature verification.
  - name: Worker
    description: Work-item queue consumed by workers (claim/heartbeat/complete/fail).
  - name: BPMN
    description: BPMN execution mode (runs, tasks, events, timers, scopes).
  - name: Events
    description: Filtered SSE and WebSocket event streams with cursor replay.
  - name: Sync
    description: Edge-to-central event push and outbox delta pull.
  - name: MCP
    description: Model Context Protocol gateway (JSON-RPC 2.0).

paths:
  /api/v1/instances:
    get:
      tags: [Instances]
      summary: List process instances
      description: Optional `project` filter; empty returns all instances ordered by started_at descending.
      operationId: listInstances
      parameters:
        - name: project
          in: query
          required: false
          schema:
            type: string
          description: Project ID to filter by.
      responses:
        "200":
          description: List of process instances.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcessInstance"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Instances]
      summary: Open a run
      description: >
        Opens a process run. Retrying with the same `idempotency_key` returns
        the existing instance without emitting duplicate events. A missing key
        is auto-generated.
      operationId: openRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenRunRequest"
      responses:
        "201":
          description: Created instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessInstance"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/instances/{id}:
    get:
      tags: [Instances]
      summary: Get a single instance
      operationId: getInstance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Instance ID (stream ID, e.g. `R-<uuid>`).
      responses:
        "200":
          description: The instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessInstance"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/instances/{id}/steps:
    post:
      tags: [Instances]
      summary: Perform a step action
      description: >
        Applies a step action to the instance: `enter | complete | fail |
        skip | assign`. Shares the same `application.Service` as the CLI, so
        projections stay atomic and are protected by `idempotency_key`.
      operationId: step
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepRequest"
      responses:
        "200":
          description: Action applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                    example: ok
                required: [status]
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/instances/{id}/compensate:
    post:
      tags: [Instances]
      summary: Compensate an instance
      description: Runs compensation for a failed/compensatable instance. Idempotent per instance.
      operationId: compensate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actor:
                  type: string
                  description: Actor requesting compensation.
              required: [actor]
      responses:
        "200":
          description: Compensation plan.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/audit/{id}:
    get:
      tags: [Audit]
      summary: Get the evidence chain for an instance
      description: >
        Returns plan -> events -> assignment -> execution plus effect records.
        When the server runs with `--verify-key`, each event signature is
        verified; `signature_valid` reflects the verification result.
      operationId: getAudit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Evidence chain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditChain"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/work-items:
    get:
      tags: [Worker]
      summary: List work items
      description: >
        With `instance`, lists that instance's work items and optionally filters
        by `state`. Without `instance`, lists claimable items globally: `ready`
        items plus `claimed` items whose lease has expired, ready to be claimed
        by another worker.
      operationId: listWorkItems
      parameters:
        - name: instance
          in: query
          required: false
          schema:
            type: string
          description: Instance ID to filter by.
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [ready, held, claimed, awaiting_approval, done, failed, cancelled]
          description: Work-item state filter.
      responses:
        "200":
          description: List of work items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkItem"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/work-items/{id}:
    get:
      tags: [Worker]
      summary: Get a work item
      description: >
        Fetch one work item, including its typed result, checkpoint/effect
        references, attempt counters, and approval record.
      operationId: getWorkItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Work item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/work-items/{id}/claim:
    post:
      tags: [Worker]
      summary: Claim a work item
      description: >
        Atomically claims a ready work item (or one whose lease has expired)
        and returns a fencing token. The token identifies this worker; stale
        workers or expired leases cannot act on the item. A claimed item
        returns 409.
      operationId: claimWorkItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRequest"
      responses:
        "200":
          description: Claimed; fencing token and lease details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/work-items/{id}/heartbeat:
    post:
      tags: [Worker]
      summary: Renew a work-item lease
      description: Extends the lease, succeeding only for the current fencing-token holder.
      operationId: heartbeatWorkItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkItemTokenRequest"
      responses:
        "200":
          description: Lease renewed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/work-items/{id}/complete:
    post:
      tags: [Worker]
      summary: Complete a work item
      description: >
        Atomically appends `StepCompleted`, marks the item done, and opens the
        next stage's item. Succeeds only for the current token holder while the
        lease is valid. `result`, `checkpoint_ref`, `effect_cursor`, and `actor`
        are optional; a token-only body remains compatible.
      operationId: completeWorkItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Fencing token returned by claim.
                actor:
                  type: string
                  description: Actor recorded on the completion event.
                result:
                  type: object
                  additionalProperties: true
                  description: Opaque typed step result.
                checkpoint_ref:
                  type: string
                  description: Reference to the worker's durable checkpoint.
                effect_cursor:
                  type: string
                  description: Reference to the worker's effect-ledger cursor.
                evidence:
                  type: object
                  additionalProperties: true
                  description: Participant completion evidence (validated against required_evidence).
                cost:
                  type: integer
                  format: int64
                  description: Cost reported for cumulative budget enforcement.
      responses:
        "200":
          description: Completed; response includes the updated work item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/work-items/{id}/request-approval:
    post:
      tags: [Worker]
      summary: Request human approval
      description: >
        Moves a claimed work item into `awaiting_approval`, persisting the
        reason, optional final arguments, and checkpoint/effect references. The
        item is requeued to `ready` after approval.
      operationId: requestWorkItemApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: Approval requested; response includes the updated work item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/work-items/{id}/approve:
    post:
      tags: [Worker]
      summary: Approve a work item
      description: >
        Records the approval decision and requeues the item to `ready` so a
        successor worker can resume from the persisted checkpoint.
      operationId: approveWorkItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor]
              properties:
                actor:
                  type: string
                comment:
                  type: string
                final_args:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Approved; response includes the updated work item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/work-items/{id}/reject:
    post:
      tags: [Worker]
      summary: Reject a work item
      description: >
        Records the rejection and marks the item `failed` with `last_error` set
        to the reason. Completion stays blocked until the item is remediated.
      operationId: rejectWorkItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor, reason]
              properties:
                actor:
                  type: string
                reason:
                  type: string
      responses:
        "200":
          description: Rejected; response includes the updated work item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/work-items/{id}/cancel:
    post:
      tags: [Worker]
      summary: Cancel a work item
      description: >
        Marks the item cancelled and releases any lease. Items carrying an
        approval record (pending or rejected) cannot be cancelled; they must be
        approved or rejected instead. Rejection requires remediation by
        closing, replanning, or migrating the run.
      operationId: cancelWorkItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/work-items/{id}/handoff:
    post:
      tags: [Worker]
      summary: Hand off a claimed work item
      description: >
        Releases the lease and returns the item to `ready` with a target
        assignee. Requires the current fencing token.
      operationId: handoffWorkItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, actor, to]
              properties:
                token:
                  type: string
                actor:
                  type: string
                to:
                  type: string
                reason:
                  type: string
      responses:
        "200":
          description: Handed off.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/work-items/{id}/takeover:
    post:
      tags: [Worker]
      summary: Take over a claimed work item
      description: >
        Admin-only force release: clears the lease and fencing token, returning
        the item to `ready` with the actor as assignee.
      operationId: takeoverWorkItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor]
              properties:
                actor:
                  type: string
                reason:
                  type: string
      responses:
        "200":
          description: Taken over.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/notifications:
    get:
      tags: [Worker]
      summary: List actor notifications
      operationId: listNotifications
      parameters:
        - name: actor
          in: query
          required: true
          schema:
            type: string
        - name: pending
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Notifications.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/notifications/{id}/ack:
    post:
      tags: [Worker]
      summary: Acknowledge a notification
      operationId: ackNotification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/approval-delegations:
    post:
      tags: [Worker]
      summary: Create an approval delegation
      operationId: createApprovalDelegation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_actor, to_actor, role]
              properties:
                from_actor:
                  type: string
                to_actor:
                  type: string
                role:
                  type: string
                expires_at:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDelegation"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [Worker]
      summary: List active delegations for a delegatee
      operationId: listApprovalDelegations
      parameters:
        - name: actor
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delegations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovalDelegation"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/approval-delegations/{id}:
    delete:
      tags: [Worker]
      summary: Revoke an approval delegation
      operationId: revokeApprovalDelegation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/work-items/{id}/fail:
    post:
      tags: [Worker]
      summary: Fail a work item
      description: Marks the item failed with an error message, succeeding only for the current token holder while the lease is valid.
      operationId: failWorkItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Fencing token returned by claim.
                error:
                  type: string
                  description: Failure reason.
                cost:
                  type: integer
                  format: int64
                  description: Cost reported against the cumulative budget.
      responses:
        "200":
          description: Failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/instances/{id}/suspend:
    post:
      tags: [Instances]
      summary: Suspend a run or a stage region
      description: >
        Empty `stages` suspends the whole instance; non-empty `stages` pauses
        those stages and their downstream DAG region while the instance stays
        active. Region work items move to `held`.
      operationId: suspendInstance
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StagePauseRequest"
      responses:
        "200":
          description: Suspended.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  stages:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/instances/{id}/resume:
    post:
      tags: [Instances]
      summary: Resume a run or a stage region
      operationId: resumeInstance
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StagePauseRequest"
      responses:
        "200":
          description: Resumed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  stages:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/bpmn/runs/{id}/suspend:
    post:
      tags: [BPMN]
      summary: Suspend a BPMN scope
      description: >
        Suspends the scope and its descendants. Task completion/failure in the
        scope returns 409; timers and message/signal subscriptions are deferred.
      operationId: suspendBPMNScope
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - name: definition_id
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopePauseRequest"
      responses:
        "200":
          description: BPMN state with `suspended_scopes`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/bpmn/runs/{id}/resume:
    post:
      tags: [BPMN]
      summary: Resume a BPMN scope
      operationId: resumeBPMNScope
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - name: definition_id
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopePauseRequest"
      responses:
        "200":
          description: BPMN state with `suspended_scopes`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/sync/push:
    post:
      tags: [Sync]
      summary: Push edge events to central
      description: >
        Idempotent batch ingest using `consumer_inbox`. Events are appended in
        one transaction; replays return duplicate ids instead of re-appending.
      operationId: syncPush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPushRequest"
      responses:
        "200":
          description: Ingest result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPushResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/events:
    get:
      tags: [Events]
      summary: Filtered SSE event stream
      description: >
        Streams events after `after_seq`. Optional `types` globs,
        `correlation_key`, and `predicate` filter deliveries. Reconnect with the
        last delivered `after_seq` to replay.
      operationId: streamEvents
      parameters:
        - name: stream
          in: query
          required: true
          schema:
            type: string
        - name: after_seq
          in: query
          schema:
            type: integer
            format: int64
        - name: types
          in: query
          description: Comma-separated glob list (for example `task.*,run.*`).
          schema:
            type: string
        - name: correlation_key
          in: query
          schema:
            type: string
        - name: predicate
          in: query
          description: Kernel condition over flattened payload fields.
          schema:
            type: string
      responses:
        "200":
          description: "SSE frames (`event: event`, `data: <json>`)."
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/events/ws:
    get:
      tags: [Events]
      summary: Filtered WebSocket event stream
      description: >
        WebSocket upgrade. Same query filters and `after_seq` replay as SSE;
        clients may send `{"type":"ack","seq":N}` frames.
      operationId: streamEventsWS
      parameters:
        - name: stream
          in: query
          required: true
          schema:
            type: string
        - name: after_seq
          in: query
          schema:
            type: integer
            format: int64
        - name: types
          in: query
          schema:
            type: string
        - name: correlation_key
          in: query
          schema:
            type: string
        - name: predicate
          in: query
          schema:
            type: string
      responses:
        "101":
          description: Switching protocols.
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/bpmn/runs:
    post:
      tags: [BPMN]
      summary: Start a BPMN run
      operationId: startBPMNRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BPMNStartRequest"
      responses:
        "201":
          description: Started BPMN run state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BPMNState"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/bpmn/runs/{id}:
    get:
      tags: [BPMN]
      summary: Get BPMN run state
      operationId: getBPMNRun
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - name: definition_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: BPMN run state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BPMNState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/bpmn/runs/{id}/tasks/{node}/complete:
    post:
      tags: [BPMN]
      summary: Complete a BPMN task
      operationId: completeBPMNTask
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - name: node
          in: path
          required: true
          schema:
            type: string
        - name: definition_id
          in: query
          required: true
          schema:
            type: string
        - name: scope
          in: query
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BPMNCompleteRequest"
      responses:
        "200":
          description: Updated BPMN state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BPMNState"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/bpmn/runs/{id}/tasks/{node}/fail:
    post:
      tags: [BPMN]
      summary: Fail a BPMN task
      operationId: failBPMNTask
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - name: node
          in: path
          required: true
          schema:
            type: string
        - name: definition_id
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BPMNFailRequest"
      responses:
        "200":
          description: Updated BPMN state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BPMNState"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/bpmn/runs/{id}/events:
    post:
      tags: [BPMN]
      summary: Fire a BPMN message/signal event
      operationId: fireBPMNEvent
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - name: definition_id
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BPMNEventRequest"
      responses:
        "200":
          description: Updated BPMN state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BPMNState"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/bpmn/runs/{id}/advance:
    post:
      tags: [BPMN]
      summary: Advance BPMN timers to a point in time
      operationId: advanceBPMNRun
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - name: definition_id
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BPMNAdvanceRequest"
      responses:
        "200":
          description: Updated BPMN state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BPMNState"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/bpmn/runs/{id}/compensate:
    post:
      tags: [BPMN]
      summary: Compensate a BPMN run
      operationId: compensateBPMNRun
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - name: definition_id
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BPMNCompleteRequest"
      responses:
        "200":
          description: Updated BPMN state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BPMNState"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/bpmn/choreographies/{id}/execute:
    post:
      tags: [BPMN]
      summary: Execute a BPMN choreography
      operationId: executeBPMNChoreography
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - name: definition_id
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Choreography execution state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "501":
          description: Transport not configured.

  /api/v1/health:
    get:
      tags: [Ops]
      summary: Health check
      operationId: health
      responses:
        "200":
          description: Store reachable.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          description: Store degraded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/status:
    get:
      tags: [Ops]
      summary: Runtime status summary
      operationId: status
      responses:
        "200":
          description: Instance/outbox/partition overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusSummary"

  /api/v1/metrics:
    get:
      tags: [Ops]
      summary: Runtime counters
      operationId: metrics
      responses:
        "200":
          description: Engine counters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Metrics"

  /api/v1/workflows:
    get:
      tags: [Workflows]
      summary: List latest workflow definitions
      operationId: listWorkflows
      responses:
        "200":
          description: Latest definition per workflow.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowDefinition"
    post:
      tags: [Workflows]
      summary: Publish a workflow definition version
      operationId: publishWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDefinition"
      responses:
        "201":
          description: Published version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_id:
                    type: string
                  version:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/workflows/{id}:
    get:
      tags: [Workflows]
      summary: Get the latest workflow definition
      operationId: getWorkflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinition"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/workflows/import-bpmn:
    post:
      tags: [Workflows, BPMN]
      summary: Import a BPMN document as a workflow preview
      description: Does not persist the definition; returns workflow, import report, and validation.
      operationId: importBPMN
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: string
      responses:
        "200":
          description: Import preview.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: BPMN body exceeds 5 MiB.

  /api/v1/sync/delta:
    get:
      tags: [Sync]
      summary: Pull a stream event delta
      operationId: syncDelta
      parameters:
        - name: stream
          in: query
          required: true
          schema:
            type: string
        - name: after_seq
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Snapshot with cursor and events.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/sync/pending:
    get:
      tags: [Sync]
      summary: List unsent outbox records
      operationId: syncPending
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 1000
            minimum: 1
      responses:
        "200":
          description: Unsent outbox records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutboxRecord"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/sync/ack:
    post:
      tags: [Sync]
      summary: Mark an outbox record as sent
      operationId: syncAck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outbox_id]
              properties:
                outbox_id:
                  type: string
      responses:
        "200":
          description: Acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /mcp:
    post:
      tags: [MCP]
      summary: MCP gateway
      description: >
        Model Context Protocol gateway (JSON-RPC 2.0 envelope, protocol version
        2024-11-05). Supports `initialize`, `tools/list` and `tools/call`
        (runtime tools: open_run, enter_step, complete_step, fail_step,
        skip_step, close_run, list_instances, get_evidence). Request `id` is
        echoed back verbatim.
      operationId: mcp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcRequest"
      responses:
        "200":
          description: JSON-RPC result or error object.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/JsonRpcSuccess"
                  - $ref: "#/components/schemas/JsonRpcError"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  parameters:
    InstanceId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    StagePauseRequest:
      type: object
      required: [actor]
      properties:
        actor:
          type: string
        reason:
          type: string
        stages:
          type: array
          items:
            type: string

    ScopePauseRequest:
      type: object
      properties:
        actor:
          type: string
        scope:
          type: string
          description: Scope path (default `root`).

    SyncPushEvent:
      type: object
      required: [id, stream_id, type]
      properties:
        id:
          type: string
        stream_id:
          type: string
        actor_id:
          type: string
        type:
          type: string
        payload:
          type: object
          additionalProperties: true
        wall_time:
          type: string
          format: date-time
        schema_version:
          type: string
        signature:
          type: string

    SyncPushRequest:
      type: object
      required: [events]
      properties:
        consumer_id:
          type: string
        events:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/SyncPushEvent"

    WorkflowDefinition:
      type: object
      required: [workflow_id, stages, transitions]
      properties:
        workflow_id:
          type: string
        title:
          type: string
        source:
          type: string
        execution_mode:
          type: string
        stages:
          type: array
          items:
            type: object
            additionalProperties: true
        transitions:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true

    StatusSummary:
      type: object
      properties:
        instances:
          type: integer
        active:
          type: integer
        done:
          type: integer
        failed:
          type: integer
        unsent_outbox:
          type: integer
        partitions:
          type: integer
        legal_holds:
          type: integer
      additionalProperties: true

    Metrics:
      type: object
      properties:
        events:
          type: integer
        instances:
          type: integer
        active:
          type: integer
        done:
          type: integer
        failed:
          type: integer
        due_timers:
          type: integer
        ready_work_items:
          type: integer
        unknown_effects:
          type: integer
      additionalProperties: true

    OutboxRecord:
      type: object
      properties:
        id:
          type: string
        stream_id:
          type: string
        event_id:
          type: string
        payload:
          type: object
          additionalProperties: true
        event_seq:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        sent:
          type: boolean
      additionalProperties: true

    BPMNStartRequest:
      type: object
      required: [definition_id]
      properties:
        definition_id:
          type: string
        project_id:
          type: string
        actor:
          type: string
        instance_id:
          type: string
        variables:
          type: object
          additionalProperties:
            type: string

    BPMNCompleteRequest:
      type: object
      properties:
        actor:
          type: string

    BPMNFailRequest:
      type: object
      properties:
        kind:
          type: string
          enum: [error, escalation]
        code:
          type: string
        scope:
          type: string
        message:
          type: string
        actor:
          type: string

    BPMNEventRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [message, signal]
        correlation_key:
          type: string
        actor:
          type: string

    BPMNAdvanceRequest:
      type: object
      properties:
        now:
          type: string
          format: date-time
        actor:
          type: string

    BPMNState:
      type: object
      properties:
        instance_id:
          type: string
        ready:
          type: array
          items:
            type: string
        ended:
          type: boolean
        completed:
          type: array
          items:
            type: string
        compensated:
          type: object
          additionalProperties: true
        variables:
          type: object
          additionalProperties:
            type: string
        tokens:
          type: object
          additionalProperties: true
        subscriptions:
          type: object
          additionalProperties: true
        suspended_scopes:
          type: object
          additionalProperties:
            type: boolean

    SyncPushResponse:
      type: object
      properties:
        accepted:
          type: array
          items:
            type: string
        duplicates:
          type: array
          items:
            type: string
        accepted_count:
          type: integer
        duplicate_count:
          type: integer

    ProcessInstance:
      type: object
      required: [instance_id, project_id, definition_id, definition_version, status, opened_by, variables, depth, started_at]
      properties:
        instance_id:
          type: string
          description: Instance ID (stream ID), e.g. `R-<uuid>`.
        project_id:
          type: string
        definition_id:
          type: string
          description: Workflow definition ID.
        definition_version:
          type: integer
          description: Definition version fixed at open.
        status:
          type: string
          enum: [active, done, failed, cancelled]
        opened_by:
          type: string
          description: Actor that opened the run.
        variables:
          type: object
          additionalProperties:
            type: string
          description: Condition variables (`--var`).
        parent_instance_id:
          type: string
          nullable: true
          description: Parent instance for subprocesses.
        depth:
          type: integer
          description: Subprocess depth (parent = 0).
        partition_id:
          type: string
        started_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true

    OpenRunRequest:
      type: object
      required: [workflow]
      properties:
        workflow:
          type: string
          description: Workflow definition ID (missing -> 400).
        project:
          type: string
        actor:
          type: string
          description: Actor ID (written to the event's actor_id).
        variables:
          type: object
          additionalProperties:
            type: string
        idempotency_key:
          type: string
          description: Idempotency key; auto-generated when omitted.

    StepRequest:
      type: object
      required: [action, stage]
      properties:
        action:
          type: string
          enum: [enter, complete, fail, skip, assign]
        stage:
          type: string
          description: Stage ID.
        actor:
          type: string
        assigned_to:
          type: string
          description: Only used by `assign`.
        error:
          type: string
          description: Only used by `fail`.
        idempotency_key:
          type: string

    AuditChain:
      type: object
      required: [instance_id, definition_id, definition_version, status]
      properties:
        instance_id:
          type: string
        definition_id:
          type: string
        definition_version:
          type: integer
        status:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        effects:
          type: array
          items:
            type: object
            properties:
              idempotency_key:
                type: string
              target:
                type: string
              state:
                type: string
              evidence:
                type: string
        stage_executions:
          type: array
          items:
            type: object
            properties:
              stage_id:
                type: string
              assigned_to:
                type: string
              assigned_by:
                type: string
              executed_by:
                type: array
                items:
                  type: string
              completed_by:
                type: string
              status:
                type: string

    AuditEvent:
      type: object
      properties:
        seq:
          type: integer
        type:
          type: string
          example: RunOpened
        actor_id:
          type: string
        wall_time:
          type: string
          format: date-time
        signature:
          type: string
        signature_valid:
          type: boolean
        payload:
          type: object
          additionalProperties: true

    WorkItem:
      type: object
      required: [id, instance_id, activity_id, state]
      properties:
        id:
          type: string
        instance_id:
          type: string
        activity_id:
          type: string
        state:
          type: string
          enum: [ready, held, claimed, awaiting_approval, done, failed, cancelled]
        assignee:
          type: string
        lease_until:
          type: string
          format: date-time
        fencing_token:
          type: string
        attempts:
          type: integer
        max_attempts:
          type: integer
        last_error:
          type: string
        result:
          type: object
          additionalProperties: true
          description: Opaque typed step result.
        checkpoint_ref:
          type: string
        effect_cursor:
          type: string
        approval:
          $ref: "#/components/schemas/WorkItemApproval"
        kind:
          type: string
          description: Participant kind (human/agent/service).
        payload:
          type: object
          additionalProperties: true
          description: Participant payload supplied by the workflow definition.
        required_evidence:
          type: array
          items:
            type: string
        evidence:
          type: object
          additionalProperties: true
          description: Completion evidence supplied by the worker.
        approval_roles:
          type: array
          items:
            type: string
        budget:
          type: integer
          format: int64
        spent:
          type: integer
          format: int64
        tool_scope:
          type: array
          items:
            type: string
        credential_ref:
          type: string
        completion_mode:
          type: string
          enum: [single, quorum, all_actors]
        required_approvals:
          type: integer
        required_completions:
          type: integer
        completions:
          type: array
          items:
            $ref: "#/components/schemas/WorkItemCompletion"
        deadline:
          type: string
          format: date-time
        escalation:
          type: string
        escalated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    WorkItemCompletion:
      type: object
      required: [actor, at]
      properties:
        actor:
          type: string
        result:
          type: object
          additionalProperties: true
        checkpoint_ref:
          type: string
        effect_cursor:
          type: string
        evidence:
          type: object
          additionalProperties: true
        cost:
          type: integer
          format: int64
        at:
          type: string
          format: date-time

    WorkItemApproval:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [pending, approved, rejected]
        approvals:
          type: array
          items:
            type: object
            properties:
              actor:
                type: string
              comment:
                type: string
              final_args:
                type: object
                additionalProperties: true
              at:
                type: string
                format: date-time
        pending_stage:
          type: string
        final_args:
          type: object
          additionalProperties: true
        checkpoint_ref:
          type: string
        effect_cursor:
          type: string
        reason:
          type: string
        requested_by:
          type: string
        requested_at:
          type: string
          format: date-time
        decided_by:
          type: string
        decided_at:
          type: string
          format: date-time
        comment:
          type: string

    ApprovalRequest:
      type: object
      required: [token, reason]
      properties:
        token:
          type: string
          description: Fencing token returned by claim.
        actor:
          type: string
        reason:
          type: string
        final_args:
          type: object
          additionalProperties: true
        checkpoint_ref:
          type: string
        effect_cursor:
          type: string

    WorkItemResponse:
      type: object
      required: [ok, work_item]
      properties:
        ok:
          type: boolean
          enum: [true]
        work_item:
          $ref: "#/components/schemas/WorkItem"

    Notification:
      type: object
      required: [id, actor, kind, created_at]
      properties:
        id:
          type: string
        actor:
          type: string
        kind:
          type: string
        work_item_id:
          type: string
        payload:
          type: string
        created_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time

    ApprovalDelegation:
      type: object
      required: [id, from_actor, to_actor, role, created_at]
      properties:
        id:
          type: string
        from_actor:
          type: string
        to_actor:
          type: string
        role:
          type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time

    ClaimRequest:
      type: object
      properties:
        lease:
          type: string
          description: Lease duration (Go duration), default `30s`.
          example: 30s
        actor:
          type: string
          description: Required when the work item is assigned to a specific actor.
        tools:
          type: array
          items:
            type: string
          description: Tools requested by the worker; must be within tool_scope.
        credential:
          type: string
          description: Credential presented for work items with credential_ref.

    LeaseRequest:
      type: object
      properties:
        lease:
          type: string
          description: Lease duration (Go duration), default `30s`.
          example: 30s

    ClaimResponse:
      type: object
      required: [token, lease, lease_until]
      properties:
        token:
          type: string
          description: Fencing token identifying the claiming worker.
        lease:
          type: string
          description: Applied lease duration.
        lease_until:
          type: string
          format: date-time
        work_item:
          $ref: "#/components/schemas/WorkItem"

    WorkItemTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Fencing token returned by claim.
        lease:
          type: string
          description: Lease duration to renew (Go duration), default `30s`.

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.

    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          nullable: true
          oneOf:
            - type: string
            - type: integer
          description: Echoed back verbatim; may be null.
        method:
          type: string
          enum: [initialize, tools/list, tools/call]
        params:
          type: object
          additionalProperties: true

    JsonRpcSuccess:
      type: object
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          nullable: true
          oneOf:
            - type: string
            - type: integer
        result:
          type: object
          additionalProperties: true

    JsonRpcError:
      type: object
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          nullable: true
          oneOf:
            - type: string
            - type: integer
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
            message:
              type: string
            data:
              type: object
              additionalProperties: true

  responses:
    BadRequest:
      description: Invalid body / action / state transition.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found (unknown work item or missing instance).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Unknown or denied actor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >
        Not claimable / stale token / lease expired / approval pending /
        approval rejected / suspended run.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
